<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rat Farmer</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/game/style.css" />
  </head>
  <body>
    <main id="app">
      <div id="grid"></div>
      <aside id="hud">
        <dl>
          <dt>Position</dt>
          <dd id="position"></dd>
          <dt>Terrain</dt>
          <dd id="terrain"></dd>
        </dl>
        <p id="live" aria-live="polite"></p>
        <button id="mute" type="button" aria-pressed="false">Sound: on</button>
      </aside>

      <div id="inventory" class="HUD">
        <template id="inventorySlot-template">
          <div id= "slot-0" class="inventorySlot">
            <image id="itemIcon" class="itemIcon" src=""></image>
            <p id="itemLabel" class="inventoryLabel">Empty</p>
          </div>
        </template>
      </div>
    </main>
    <script type="module" src="/game/main.ts"></script>
  </body>
</html>
