<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rat Farmer</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/game/style.css" />
  </head>
  <body>
    <main id="app">
      <div id="grid"></div>
      <aside id="hud">
        <dl>
          <dt>Position</dt>
          <dd id="position"></dd>
          <dt>Terrain</dt>
          <dd id="terrain"></dd>
          <dt>Craft them all to win!</dt>
          <dt id="win"></dt>
        </dl>
        <p id="live" aria-live="polite"></p>
        <button id="mute" type="button" aria-pressed="false">Sound: on</button>
      </aside>

      <div id="inventory" class="HUD"></div>
      <template id="inventorySlot-template">
        <div id= "slot-x" class="inventorySlot">
          <image id="itemIcon" class="itemIcon" src=""></image>
          <p id="itemLabel" class="itemLabel">Empty</p>
        </div>
      </template>

      <div id="recipes" class="HUD"></div>

      <template id="recipeSlot-template">
        <button type="button" class="recipe-button"
          title="rat burger: 1 rat, 1 bread, and 1 tomato."
          aria-pressed="false">
          <image src="" class="recipeIcon"></image>
          <h2 class="recipeLabel">amount owned: 0</h2>
        </button>
      </template>
    </main>
    <script type="module" src="/game/main.ts"></script>
  </body>
</html>
